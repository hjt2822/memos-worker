name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "dd2fab8c-2e89-4e8f-ba70-be9aa553a4d1"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "06626f15a9bb4f7b89aba1f8d24f7c54"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
